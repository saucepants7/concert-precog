name: concert-brain

on:
  schedule:
    - cron: "0 13 * * *"       # once a day (13:00 UTC ~ 8-9am ET)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find shows
        env:
          LASTFM_API_KEY:     ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER:        ${{ secrets.LASTFM_USER }}
          TM_API_KEY:         ${{ secrets.TM_API_KEY }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          NTFY_TOPIC:         ${{ secrets.NTFY_TOPIC }}
          SEED_ARTISTS:       ${{ secrets.SEED_ARTISTS }}
        run: python concert_brain.py

      - name: Save data + dashboard
        run: |
          git config user.name  "concert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add concerts.db index.html
          git commit -m "update concerts" || echo "nothing changed"
          git push
